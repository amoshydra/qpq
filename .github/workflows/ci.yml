name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Run tests
        run: pnpm run test:run

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build

      - name: Validate package
        if: runner.os == 'Linux'
        run: pnpm run lint:package

      - name: Smoke-test POSIX wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./qpq.sh --version
          temp_dir="$(mktemp -d)"
          ln -s "$GITHUB_WORKSPACE/qpq.sh" "$temp_dir/qpq"
          "$temp_dir/qpq" --version
