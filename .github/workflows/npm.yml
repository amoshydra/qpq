name: Release to NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PAT can be supplied to let CI run on release-please PRs.
          # Falls back to the workflow token for normal release creation.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Checkout release commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Install pnpm
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node 22.14+ and npm CLI 11.5.1+.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Test launcher
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: pnpm test

      - name: Validate package
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: pnpm run lint:package

      - name: Install Go
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build Go binaries
        if: ${{ steps.release.outputs.release_created == 'true' }}
        working-directory: go
        run: make cross

      - name: Create Go checksums
        if: ${{ steps.release.outputs.release_created == 'true' }}
        working-directory: go
        run: cd dist && sha256sum qpq-* > SHA256SUMS

      - name: Upload Go binaries to release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" go/dist/* --clobber

      - name: Publish npm packages
        if: ${{ steps.release.outputs.release_created == 'true' }}
        # Trusted publishing authenticates with OIDC and generates provenance
        # automatically. NPM_TOKEN is intentionally not used here.
        run: node scripts/publish-npm.mjs
